name: Fork build
on:
  push:
    branches: [fork-6.x]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: sonar-dependency-check-plugin
          path: sonar-dependency-check-plugin/target/sonar-dependency-check-plugin-*.jar
          if-no-files-found: error
